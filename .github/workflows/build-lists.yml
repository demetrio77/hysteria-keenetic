name: Build Domain Lists

on:
  schedule:
    - cron: '0 3 * * *'  # daily at 3:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get install -y -qq jq whois
          pip install -r ci/requirements.txt

      - name: Build lists
        run: bash ci/build-lists.sh

      - name: Validate core service files
        run: |
          for service in youtube google facebook telegram discord; do
            if [ ! -s "output/${service}.lst" ]; then
              echo "ERROR: output/${service}.lst is missing or empty"
              exit 1
            fi
            echo "OK: ${service}.lst ($(wc -l < "output/${service}.lst") entries)"
          done

      - name: Validate CIDRs in key services
        run: |
          for service in youtube google facebook telegram; do
            cidrs=$(grep -cE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(/[0-9]+)?$' "output/${service}.lst") || cidrs=0
            if [ "$cidrs" -eq 0 ]; then
              echo "WARNING: ${service}.lst has no CIDRs"
            else
              echo "OK: ${service}.lst has $cidrs CIDRs"
            fi
          done

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lists-latest
          name: "Domain Lists (auto-updated)"
          body: |
            Automatically generated domain + CIDR lists.
            Updated daily at 03:00 UTC.

            Download individual service files or use `manifest.txt` for version checking.
          files: output/*
          make_latest: true
