# sources.conf — declarative service mapping for domain list builds
#
# Format: slug|display_name|upstream_url|cidr_provider
#
# slug:           filename without .lst extension (must match service name conversion)
# display_name:   human-readable name (matches SERVICES config values)
# upstream_url:   direct URL to domain list
# cidr_provider:  CIDR source to append (google|meta|telegram|twitter|apple|none)
#
# Service name -> slug conversion: tr '[:upper:]' '[:lower:]' | tr ' ' '-'
# Example: "Github Copilot" -> "github-copilot"

